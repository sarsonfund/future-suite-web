<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1d592"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d29"/>
    </linearGradient>
  </defs>
  <!-- Navy background -->
  <rect width="512" height="512" rx="64" fill="#0a0f1d"/>
  <!-- Gold border square (matching logo-mark) -->
  <rect x="96" y="96" width="320" height="320" rx="8" fill="none" stroke="url(#gold)" stroke-width="20"/>
  <!-- Diagonal gold slash (matching logo-mark ::after) -->
  <line x1="176" y1="336" x2="336" y2="176" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
</svg>
