apiVersion: apps/v1
kind: Deployment
metadata:
  name: future-suite
  namespace: future-suite
  labels:
    app: future-suite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: future-suite
  template:
    metadata:
      labels:
        app: future-suite
    spec:
      containers:
        - name: future-suite
          image: future-suite:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
