apiVersion: apps/v1
kind: Deployment
metadata:
  name: future-suite
  namespace: future-suite-qa
  labels:
    app: future-suite
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: future-suite
  template:
    metadata:
      labels:
        app: future-suite
    spec:
      containers:
        - name: future-suite
          image: future-suite:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: future-suite-config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
