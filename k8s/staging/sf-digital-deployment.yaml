apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-digital
  namespace: sf-digital-qa
  labels:
    app: sf-digital
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sf-digital
  template:
    metadata:
      labels:
        app: sf-digital
    spec:
      containers:
        - name: sf-digital
          image: sf-digital:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sf-digital-config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
