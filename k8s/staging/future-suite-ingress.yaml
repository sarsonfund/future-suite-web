apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: future-suite
  namespace: future-suite-qa
  annotations:
    # Cloudflare terminates TLS — Traefik only needs HTTP (port 80)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: www-stg.futuresuite.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: future-suite
                port:
                  number: 80
