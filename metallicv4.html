<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SF Digital</title>
    <style>
        :root {
            --navy: #0a0f1d;
            --gold-gradient: linear-gradient(135deg, #f1d592, #d4af37, #8a6d29);
            --gold-grid: rgba(212, 175, 55, 0.4);
            --white-grid: rgba(255, 255, 255, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--navy);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
            perspective: 1200px; 
        }

        /* 3D GRID CONTAINER */
        .grid-perspective-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 90% 10%, #1a2235 0%, #0a0f1d 85%);
        }

        .grid-plane {
            position: absolute;
            width: 400%;
            height: 400%;
            top: -150%;
            left: -150%;
            background-image: 
                linear-gradient(var(--gold-grid) 2px, transparent 2px),
                linear-gradient(90deg, var(--white-grid) 1px, transparent 1px);
            background-size: 80px 80px;
            transform: rotateX(65deg) rotateY(0deg) rotateZ(25deg);
            animation: moveTowardsHorizon 5s linear infinite;
        }

        @keyframes moveTowardsHorizon {
            from { background-position: 0 0; }
            to { background-position: 0 -80px; }
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-mark {
            width: 35px;
            height: 35px;
            border: 2px solid #d4af37;
            position: relative;
            background: rgba(212, 175, 55, 0.1);
        }

        .logo-mark::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 2px;
            background: var(--gold-gradient);
            top: 50%;
            left: 15%;
            transform: rotate(-45deg);
        }

        .brand-name {
            font-weight: 800;
            letter-spacing: 5px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        /* HERO AREA */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, rgba(10, 15, 29, 0.2) 0%, rgba(10, 15, 29, 0.9) 100%);
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: 20px;
            margin: 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            padding-left: 20px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .divider {
            width: 200px;
            height: 1px;
            background: var(--gold-gradient);
            margin: 40px 0;
            opacity: 0.8;
        }

        /* PILLAR NAVIGATION BLOCKS */
        .pillar-container {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }

        .pillar {
            position: relative;
            padding: 15px 35px;
            border: 1px solid #d4af37;
            background: rgba(212, 175, 55, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d4af37;
        }

        .pillar:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

    </style>
</head>
<body>

    <div class="grid-perspective-wrap">
        <div class="grid-plane"></div>
    </div>

    <header>
        <div class="brand-container">
            <div class="logo-mark"></div>
            <div class="brand-name">SF Digital</div>
        </div>
    </header>

    <div class="hero">
        <div style="letter-spacing: 8px; opacity: 0.9; margin-bottom: 10px; font-size: 0.8rem; color: #d4af37;">INTELLIGENCE SECURED</div>
        <h1>SF DIGITAL</h1>
        <div class="divider"></div>
        
        <div class="pillar-container">
            <div class="pillar">Private LLM</div>
            <div class="pillar">Portfolio Tracking</div>
            <div class="pillar">AI Tools</div>
        </div>
    </div>

</body>
</html>
